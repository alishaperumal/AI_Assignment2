ensembles:
  - name: submitted_pruned30
    members: [pruned30]
  - name: localnorm47
    members: [localnorm47]
  - name: teacher+kd18
    members: [teacher, kd18]
  - name: teacher+kd18+localnorm47
    members: [teacher, kd18, localnorm47]
  - name: teacher+kd18+clahe46+localnorm47
    members: [teacher, kd18, clahe46, localnorm47]
